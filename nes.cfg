# NROM-256 (mapper 0): 32K PRG, 8K CHR, vertical mirroring.
SYMBOLS {
    __STACKSIZE__: type = weak,   value = $0500;   # cc65 C stack
    NES_MAPPER:    type = export, value = 0;
    NES_PRG_BANKS: type = export, value = 2;       # 16K units
    NES_CHR_BANKS: type = export, value = 1;       # 8K units
    NES_MIRRORING: type = export, value = 1;       # 0 horiz, 1 vert
}
MEMORY {
    ZP:     file = "", start = $0000, size = $0100, type = rw, define = yes;
    HEADER: file = %O, start = $0000, size = $0010, fill = yes;
    ROM0:   file = %O, start = $8000, size = $7FFA, fill = yes, define = yes;
    ROMV:   file = %O, start = $FFFA, size = $0006, fill = yes;
    CHR:    file = %O, start = $0000, size = $2000, fill = yes;
    # $0100 FamiTone, $01C0 palette buf, $0200 OAM buffer
    RAM:    file = "", start = $0300, size = __STACKSIZE__, define = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,              type = zp;
    HEADER:   load = HEADER,          type = ro;
    STARTUP:  load = ROM0,            type = ro,  define = yes;
    LOWCODE:  load = ROM0,            type = ro,  optional = yes;
    ONCE:     load = ROM0,            type = ro,  optional = yes;
    CODE:     load = ROM0,            type = ro,  define = yes;
    RODATA:   load = ROM0,            type = ro,  define = yes;
    DATA:     load = ROM0, run = RAM, type = rw,  define = yes;
    BSS:      load = RAM,             type = bss, define = yes;
    SAMPLES:  load = ROM0,            type = ro,  optional = yes;
    VECTORS:  load = ROMV,            type = ro;
    CHARS:    load = CHR,             type = ro;
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__,
            count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor,  label = __DESTRUCTOR_TABLE__,
            count = __DESTRUCTOR_COUNT__,  segment = RODATA;
    CONDES: type = interruptor, label = __INTERRUPTOR_TABLE__,
            count = __INTERRUPTOR_COUNT__, segment = RODATA, import = __CALLIRQ__;
}
